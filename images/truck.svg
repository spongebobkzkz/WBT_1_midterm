    <text x="226" y="140" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1" textLength="214" lengthAdjust="spacingAndGlyphs" fill="#10253f">CARGO<tspan fill="#ff8a3d">/</tspan>PULSE</text>
