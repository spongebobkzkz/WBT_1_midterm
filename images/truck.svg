<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .wheel { animation: spin 1.6s linear infinite; }
      .speed { animation: rush 1.2s ease-out infinite; }
      .speed + .speed { animation-delay: 0.4s; }
      .speed + .speed + .speed { animation-delay: 0.8s; }
      .body { animation: bump 1.6s ease-in-out infinite; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rush { from { transform: translateX(14px); opacity: 0; } 40% { opacity: 1; } to { transform: translateX(-16px); opacity: 0; } }
    @keyframes bump { 50% { transform: translateY(-2px); } }
  </style>

  <ellipse cx="270" cy="266" rx="236" ry="11" fill="#06111f" opacity="0.25"/>
  <line x1="24" y1="284" x2="500" y2="284" stroke="#7fb0ec" stroke-width="4" stroke-linecap="round" stroke-dasharray="34 22" opacity="0.6"/>

  <g stroke="#7fb0ec" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line class="speed" x1="10" y1="104" x2="64" y2="104"/>
    <line class="speed" x1="26" y1="140" x2="64" y2="140"/>
    <line class="speed" x1="4" y1="176" x2="64" y2="176"/>
  </g>

  <g class="body">
