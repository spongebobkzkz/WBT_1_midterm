<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="Request a cargo delivery quote from Cargo/Pulse"
    >

    <title>Get a quote — Cargo/Pulse</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar sticky-top">
        <div class="container py-2">

            <a class="navbar-brand brand" href="index.html">
                CARGO<span>/</span>PULSE
            </a>

            <div class="main-navigation">
                <a class="nav-link" href="index.html">
                    Home
                </a>

                <a class="nav-link" href="services.html">
                    Services
                </a>

                <a class="nav-link" href="tracking.html">
                    Tracking
                </a>

                <a class="nav-link" href="quote.html">
                    Get a quote
                </a>
            </div>

        </div>
    </nav>

    <main>

        <section class="page-head">
            <div class="container">
                <div class="eyebrow">
                    Start a shipment
                </div>

                <h1 class="section-title">
                    Tell us what<br>
                    you need to move.
                </h1>

                <p class="text-secondary">
                    Complete the form and our logistics specialist will prepare
                    an estimate.
                </p>
            </div>
        </section>

        <section class="section pt-3">
            <div class="container">
                <div class="row">

                    <div class="col-lg-8">
                        <form class="cardx" action="#" method="post">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="customerName"
                                    >
                                        Your name
                                    </label>

                                    <input
                                        class="form-control"
                                        type="text"
                                        id="customerName"
                                        name="customerName"
                                        placeholder="Name"
                                        required
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="contact"
                                    >
                                        Phone or email
                                    </label>

                                    <input
                                        class="form-control"
                                        type="text"
                                        id="contact"
                                        name="contact"
                                        placeholder="Contact"
                                        required
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="from"
                                    >
                                        From
                                    </label>

                                    <input
                                        class="form-control"
                                        type="text"
                                        id="from"
                                        name="from"
                                        placeholder="City or country"
                                        required
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="to"
                                    >
                                        To
                                    </label>

                                    <input
                                        class="form-control"
                                        type="text"
                                        id="to"
                                        name="to"
                                        placeholder="City or country"
                                        required
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="cargoType"
                                    >
                                        Cargo type
                                    </label>

                                    <select
                                        class="form-select"
                                        id="cargoType"
                                        name="cargoType"
                                    >
                                        <option>
                                            Commercial goods
                                        </option>

                                        <option>
                                            Personal parcel
                                        </option>

                                        <option>
                                            Electronics
                                        </option>

                                        <option>
                                            Fragile goods
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label
                                        class="form-label"
                                        for="weight"
                                    >
                                        Approximate weight
                                    </label>

                                    <input
                                        class="form-control"
                                        type="number"
                                        id="weight"
                                        name="weight"
                                        min="1"
                                        placeholder="kg"
                                    >
                                </div>

                                <div class="col-12">
                                    <label
                                        class="form-label"
                                        for="details"
                                    >
                                        Additional details
                                    </label>

                                    <textarea
                                        class="form-control"
                                        id="details"
                                        name="details"
                                        rows="4"
                                        placeholder="Dimensions, deadline, special requirements..."
                                    ></textarea>
                                </div>

                                <div class="col-12">
                                    <button
                                        class="btn btn-orange"
                                        type="submit"
                                    >
                                        Request estimate →
                                    </button>
                                </div>

                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div
            class="container d-flex flex-column flex-md-row justify-content-between gap-3"
        >
            <div>
                <div class="brand footer-brand">
                    CARGO<span>/</span>PULSE
                </div>

                <div class="muted mt-2">
                    Clear logistics for growing businesses.
                </div>
            </div>

            <div class="muted">
                © 2026 Cargo/Pulse, Kazakhstan
            </div>
        </div>
    </footer>

</body>
</html>
